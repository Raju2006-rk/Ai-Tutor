<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f0b1e" />
  <title>AI Tutor — Learn. Speak. Understand. Improve.</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root">
    <div class="boot">
      <div class="boot-logo">🤖</div>
      <div class="boot-title">AI Tutor</div>
      <div class="boot-sub">Loading your learning assistant…</div>
      <noscript>This app requires JavaScript.</noscript>
    </div>
  </div>

  <!-- React from CDN (two small files). NO Babel: the app ships pre-compiled
       as a single app.js, so the page loads fast. -->
  <script defer crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script defer crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Pre-compiled app bundle (generated by ./build.sh from the js/ sources). -->
  <script defer src="app.js"></script>

  <!-- Fallback: if React failed to load (offline / blocked network),
       show guidance instead of a blank screen. -->
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        var ok = window.React && window.ReactDOM;
        var root = document.getElementById('root');
        if (!ok && root && root.querySelector('.boot')) {
          root.innerHTML =
            '<div class="boot">' +
            '<div class="boot-logo">📡</div>' +
            '<div class="boot-title">Couldn\'t load React</div>' +
            '<div class="boot-sub" style="max-width:320px;text-align:center;line-height:1.5">' +
            'This app loads React from a CDN (unpkg.com). Your network appears to be ' +
            'blocking it. Connect to the internet and reload.' +
            '</div></div>';
        }
      }, 4000);
    });
  </script>
</body>
</html>
